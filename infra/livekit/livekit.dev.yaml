# Self-hosted LiveKit — local / single-clinic development
# Keys MUST match backend .env: LIVEKIT_API_KEY / LIVEKIT_API_SECRET
# Generate new keys: docker run --rm livekit/livekit-server:latest generate-keys

port: 7880
bind_addresses:
  - ""

log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50100
  port_range_end: 50120
  use_external_ip: false

room:
  empty_timeout: 600
  max_participants: 10

keys:
  APIPefjr68gHmQM: OCm9EYheltH4XelO3Y5Cx4GpCIgps04ZcpSL6YEtPzZ
