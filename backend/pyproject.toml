[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # Line too long (handled by Black formatter within ruff)
]

[tool.ruff.lint.per-file-ignores]
# Ignore completely imported but unused in __init__.py files
"__init__.py" = ["F401"]
"*/migrations/*" = ["E501", "F401", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
