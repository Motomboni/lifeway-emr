[pytest]
DJANGO_SETTINGS_MODULE = core.settings
# Only discover real pytest suites (exclude backend root manual scripts/)
testpaths = tests apps
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
norecursedirs = scripts management migrations static media htmlcov .git __pycache__ node_modules .venv venv
addopts = --tb=short --strict-markers --reuse-db
markers =
    django_db: marks tests as requiring database access
