# Orthanc (DICOMweb + OHIF) + MinIO — standalone imaging stack.
# Run alone for local dev:
#   docker compose -f docker-compose.imaging.yml up -d
#
# Merge with main EMR compose for production (also add docker-compose.imaging.env.yml):
#   docker compose -f docker-compose.standalone.yml -f docker-compose.imaging.yml -f docker-compose.imaging.env.yml up -d
#
# Orthanc REST / DICOMweb:  http://localhost:8042
# OHIF (via Vite/nginx proxy): /ohif/viewer
# MinIO console:            http://localhost:9001

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-32Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb -p local/emr-radiology || true;
      mc mb -p local/orthanc-dicom || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  orthanc:
    image: jodogne/orthanc-plugins:1.12.4
    volumes:
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_data:/var/lib/orthanc/db
    ports:
      - "8042:8042"
      - "4242:4242"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u orthanc:orthanc http://localhost:8042/system || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  minio_data:
  orthanc_data:
