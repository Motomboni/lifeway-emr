# EMR app env overlay — merge with main compose + docker-compose.imaging.yml.
# Usage:
#   docker compose -f docker-compose.standalone.yml -f docker-compose.imaging.yml -f docker-compose.imaging.env.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.imaging.yml -f docker-compose.imaging.env.yml up -d

services:
  backend:
    environment:
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
      OHIF_VIEWER_URL: ${OHIF_VIEWER_URL:-/ohif/viewer}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: emr-radiology
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: emr-radiology
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_USE_SSL: "false"
      AWS_S3_ADDRESSING_STYLE: path
      RADIOLOGY_STORAGE: ${RADIOLOGY_STORAGE:-storages.backends.s3boto3.S3Boto3Storage}
    depends_on:
      orthanc:
        condition: service_healthy

  app:
    environment:
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
      OHIF_VIEWER_URL: ${OHIF_VIEWER_URL:-/ohif/viewer}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: emr-radiology
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_STORAGE_BUCKET_NAME: emr-radiology
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_USE_SSL: "false"
      AWS_S3_ADDRESSING_STYLE: path
      RADIOLOGY_STORAGE: ${RADIOLOGY_STORAGE:-storages.backends.s3boto3.S3Boto3Storage}
    depends_on:
      orthanc:
        condition: service_healthy
